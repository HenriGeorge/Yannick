# cc-worktrees per-repo config — sourced by the runner on create. Generated 2026-06-19.
SETUP="none"        # npm | py-editable | none  — first-run dependency install in the pane
PROFILE="non-web"    # web | non-web
BASE_PORT=3000       # base port for the free-port search (the -b flag overrides this)
# SETUP_CMD=""         # custom install command (runs in the pane; overrides SETUP's default)
# COPY_FILES=".env .env.*"        # gitignored files carried into each new worktree (patterns rel. to root)
# NESTED_INSTALL="tests/e2e e2e"  # extra dirs with their own package.json to npm-install on create (#11)
# CACHE_WARM_CMD=""               # optional cmd run in the pane after install to warm caches (#11)
# DEV_SERVER_CMD=""               # opt-in (#27): backgrounded in the implementer pane after install; lsof-confirmed on $PORT
# CREW_ARCHIVE=1                  # archive crew/*.md to <repo>/crew-archive/<branch>/ on rm (#12)
# CREW_MODEL="claude-opus-4-8[1m]"  # model each crew agent launches with (#24); '' = inherit
# CREW_PERMISSION_MODE="auto"       # acceptEdits|auto|bypassPermissions|default|dontAsk|plan (#24/#25) — set bypassPermissions for MCP-heavy crews to avoid #25 numbered-prompt stalls.
# CREW_EFFORT=""                    # low|medium|high|xhigh|max for each crew agent; '' = inherit (#24)
# FIGMA_SCAFFOLD=0                   # 1 = scaffold the SVG→Figma bridge into EVERY new worktree (design-heavy repos); override per-worktree with --no-figma
# FIGMA_SOCKET=0                    # 1 = on create, bring up the talk-to-figma relay (:3055) + launch Figma
# FIGMA_FILE_KEY=""                 # optional figma:// file key opened by FIGMA_SOCKET / 'figma up'
# FIGMA_SOCKET_CMD=""               # custom relay start cmd ('' = autodetect the clone's 'bun run socket')
# FIGMA_RUN_LAST=0                  # 1 = best-effort ⌥⌘P 'Run last plugin' on 'figma up'/create (needs macOS Accessibility perm)
FIGMA_SCAFFOLD=1   # design-heavy: scaffold the SVG→Figma bridge into every worktree
FIGMA_SOCKET=1     # design-heavy: auto-start talk-to-figma relay + launch Figma on create
FIGMA_RUN_LAST=1   # best-effort ⌥⌘P run-last on create (needs macOS Accessibility)
