<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Claude MCP Plugin</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        font-size: 12px;
        padding: 16px;
        color: #400B55;
        background-color: #FDF8FF;
      }
      .dark {
        color: #fff;
        background-color: #2c2c2c;
      }
      .mcp-plugin__mode {
        position: absolute;
        bottom: -8px;
        right: -4px;
        cursor: pointer;
        transition: ease 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-size: 10px;
        opacity: 0.4;
      }
      .mcp-plugin__mode:hover {
        opacity: 1;
      }
      .mcp-plugin {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 20px;
        height: 100%;
      }
      .mcp-plugin__header {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .mcp-plugin__header-title {
        font-size: 14px;
        margin: 0;
      }
      .mcp-plugin__header-description {
        font-size: 12px;
        margin: 0;
      }
      .dark .mcp-plugin__header-description {
        color: #CCCCCC;
      }
      .mcp-plugin__content {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      /* ── Channel rows ───────────────────────────────────────── */
      .mcp-plugin__rows {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .mcp-plugin__row {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .mcp-plugin__row-top {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .mcp-plugin__channel-input {
        flex: 1 1 auto;
        min-width: 0;
        box-sizing: border-box;
        height: 32px;
        padding: 0 8px;
        border: 1px solid #732392;
        border-radius: 4px;
        background-color: transparent;
        color: inherit;
        font-size: 12px;
      }
      .dark .mcp-plugin__channel-input {
        border-color: #5467F7;
      }
      .mcp-plugin__channel-input:disabled {
        opacity: 0.6;
      }
      .mcp-plugin__row-toggle {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        min-width: 84px;
        padding: 0 10px;
        border: 1px solid #732392;
        background-color: #732392;
        color: #fff;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        transition: ease 0.2s;
      }
      .dark .mcp-plugin__row-toggle {
        border-color: #5467F7;
        background-color: #5467F7;
      }
      .mcp-plugin__row-toggle:hover {
        background-color: transparent;
        color: #732392;
      }
      .dark .mcp-plugin__row-toggle:hover {
        background-color: transparent;
        color: #fff;
        border-color: #5467F7;
      }
      /* Connected → toggle becomes a secondary "Disconnect" */
      .mcp-plugin__row.is-connected .mcp-plugin__row-toggle {
        background-color: transparent;
        color: #732392;
      }
      .dark .mcp-plugin__row.is-connected .mcp-plugin__row-toggle {
        color: #fff;
      }
      .mcp-plugin__row.is-connected .mcp-plugin__row-toggle:hover {
        background-color: #732392;
        color: #fff;
      }
      .dark .mcp-plugin__row.is-connected .mcp-plugin__row-toggle:hover {
        background-color: #5467F7;
      }
      .mcp-plugin__row-remove {
        flex: 0 0 auto;
        width: 24px;
        height: 32px;
        border: none;
        background: transparent;
        color: inherit;
        opacity: 0.45;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        border-radius: 4px;
      }
      .mcp-plugin__row-remove:hover {
        opacity: 1;
      }
      .mcp-plugin__connection-status {
        padding: 6px 8px;
        border-radius: 4px;
        line-height: 1.35;
        font-size: 11px;
      }
      .mcp-plugin__connection-status.connected {
        background: #D8FFBB;
        color: #223005;
      }
      .mcp-plugin__connection-status.disconnected {
        background-color: #FFC8BD;
        color: #280B06;
      }
      .mcp-plugin__connection-status.info {
        background-color: #BBFFFD;
        color: #0B4240;
      }
      /* Resting state — never connected yet. Muted, not alarming (5 idle rows shouldn't look like 5 errors). */
      .mcp-plugin__connection-status.idle {
        background-color: rgba(128, 128, 128, 0.14);
        color: inherit;
        opacity: 0.75;
      }
      .mcp-plugin__connection-status.operation-error {
        color: #280B06;
      }
      .mcp-plugin__channel-name {
        font-weight: bold;
        text-decoration: underline;
        cursor: pointer;
        position: relative;
      }
      .mcp-plugin__channel-name:hover {
        text-decoration: none;
      }
      /* ── Add-channel button ─────────────────────────────────── */
      .mcp-plugin__add {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        padding: 0 10px;
        border: 1px dashed #732392;
        background-color: transparent;
        color: #732392;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        transition: ease 0.2s;
      }
      .dark .mcp-plugin__add {
        border-color: #5467F7;
        color: #fff;
      }
      .mcp-plugin__add:hover {
        background-color: #732392;
        color: #fff;
      }
      .dark .mcp-plugin__add:hover {
        background-color: #5467F7;
      }
      .hidden {
        display: none !important;
      }
      /* ── Shared progress (active command across any channel) ── */
      .mcp-plugin__progress {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .mcp-plugin__progress-bar {
        width: 100%;
        height: 4px;
        background-color: #EDD0F8;
        border-radius: 4px;
      }
      .dark .mcp-plugin__progress-bar {
        background-color: #575757;
      }
      .mcp-plugin__progress-bar-fill {
        width: 0%;
        height: 4px;
        background-color: #732392;
        border-radius: 4px;
        transition: width 0.3s;
      }
      .dark .mcp-plugin__progress-bar-fill {
        background-color: #5467F7;
      }
      .mcp-plugin__progress-indicators {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 10px;
      }
      .dark .mcp-plugin__progress-indicators {
        color: #ABABAB;
      }
      #progress-status {
        display: none;
      }
      .operation-error {
        color: #f87359ff;
      }
    </style>
  </head>
  <body class="dark">
    <div class="container mcp-plugin">
      <div class="mcp-plugin__mode">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          fill="#400b55"
          class="mcp-plugin__mode-moon hidden"
          viewBox="0 -960 960 960"><path d="M483.11-116q-76.3 0-143.05-28.93-66.76-28.93-116.48-78.65t-78.65-116.48Q116-406.81 116-483.11q0-125.27 75.12-223.93 75.11-98.65 198.19-129.65-10.08 96.31 20.34 181.27 30.43 84.96 97.12 151.65 64.69 64.69 151.65 94.62 86.96 29.92 178.27 19.84-29.38 121.08-128.85 197.19Q608.38-116 483.11-116m-.11-52q88 0 164-45t115-122.11q-83-5.01-158.5-39.56T469-468.3q-60-60.08-94-134.89T335-762q-77 41-122 116.18-45 75.19-45 162.82 0 131.25 91.88 223.12Q351.75-168 483-168m-14-300.38"/></svg>

          xmlns="http://www.w3.org/2000/svg"

          class="mcp-plugin__mode-sun"
          viewBox="0 -960 960 960">
            <path d="M454-794.31V-902h52v107.69zM454-58v-107.69h52V-58zm340.31-396v-52H902v52zM58-454v-52h107.69v52zm660.31-227.15-37.16-37.16L759-798.38 798.38-759zM202-162.62 162.62-202l79.07-76.85 37.16 37.16zm557 0-77.85-79.07 37.16-37.16L798.38-202zM241.69-681.15 162.62-759 202-798.38l76.85 80.07zm82.54 356.92Q260-388.46 260-480t64.23-155.77T480-700t155.77 64.23T700-480t-64.23 155.77T480-260t-155.77-64.23M599-360.5q49-49.5 49-119.75 0-70.24-48.75-119-48.76-48.75-119-48.75Q410-648 361-599.25q-49 48.76-49 119 0 70.25 48.75 119.75 48.76 49.5 119 49.5Q550-311 599-360.5M481-481"/></svg>
      </div>
      <div class="header mcp-plugin__header">
        <h1 class="mcp-plugin__header-title">🤖🎨 Claude Talk to Figma</h1>
        <p class="mcp-plugin__header-description">AI agents reading and modifying Figma designs — one window, many channels</p>
      </div>
      <div class="content mcp-plugin__content">
        <div id="rows" class="mcp-plugin__rows"></div>
        <button id="btn-add" class="mcp-plugin__add" type="button">+ Add channel</button>
        <div id="progress-container" class="hidden mcp-plugin__progress">
          <div class="mcp-plugin__progress-bar">
            <div id="progress-bar" class="mcp-plugin__progress-bar-fill"></div>
          </div>
          <div class="mcp-plugin__progress-indicators">
            <div id="progress-status">Not started</div>
            <div id="progress-message" class="mcp-plugin__progress-message">No operation in progress</div>
            <div id="progress-percentage">0%</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /**
       * ClaudeMCPPlugin — multi-channel panel.
       *
       * One plugin window owns N WebSocket connections to the local relay (ws://localhost:3055),
       * each joined to its OWN channel. The Figma sandbox (code.js) is channel-agnostic: it runs
       * `execute-command` and replies by `id` only. So:
       *   - a per-command Map<id → connection> routes each reply back out the originating socket;
       *   - a SINGLE serialization queue feeds the sandbox one command at a time (N channels share
       *     one Figma document — without this, concurrent document mutations could interleave).
       *
       * Channel naming convention: "<fileKey>_<fileName>_<N>" — fileKey = figma.fileKey (the immutable
       * 22-char URL key, the collision-free file identity) and fileName = figma.root.name (readable
       * suffix). An unsaved file has no fileKey → base falls back to "<fileName>_<N>". Default = 5 rows
       * (_1.._5). "+" appends the next index; the list is persisted via code.js clientStorage and
       * restored on load, then rebased to the current file's base on a mismatch.
       */
      class ClaudeMCPPlugin {
        constructor() {
          this.serverPort = 3055;
          this.baseName = "channel"; // replaced by figma.root.name on init / auto-connect
          this.fileChannel = null;   // the open file's name (figma.root.name), set by auto-connect; null until then
          this.connections = []; // [{ rowId, channel, socket, connected, els:{...} }]
          this.pending = new Map(); // commandId → connection (response routing)
          this.queue = []; // [{ connection, msg }] — serialized execute-command feed
          this.inFlight = false;
          this.inFlightId = null; // id of the command the sandbox is CURRENTLY running
          this.inFlightTimer = null; // watchdog for a sandbox command that never replies
          this.rowSeq = 0; // unique row element id
          this.booted = false; // rows built yet?
          this.autoConnectedOnce = false;
          this.sawInitSettings = false; // has init-settings (the saved list) actually arrived?
          this.wantAutoConnect = false; // boot path requested all rows be auto-connected

          this.ui = {
            rows: document.getElementById("rows"),
            addBtn: document.getElementById("btn-add"),
            progressContainer: document.getElementById("progress-container"),
            progressBar: document.getElementById("progress-bar"),
            progressMessage: document.getElementById("progress-message"),
            progressStatus: document.getElementById("progress-status"),
            progressPercentage: document.getElementById("progress-percentage"),
            modeToggle: document.querySelector(".mcp-plugin__mode"),
            modeSun: document.querySelector(".mcp-plugin__mode-sun"),
            modeMoon: document.querySelector(".mcp-plugin__mode-moon"),
          };

          this.init();
        }

        init() {
          this.ui.addBtn.addEventListener("click", () => { if (this.booted) this.addChannelRow(); }); // #1103 add-guard — a pre-boot "+" would desync the row list vs. the pending saved/default rows
          this.ui.modeToggle.addEventListener("click", () => this.toggleMode());

          // Clipboard — event delegation over the rows container.
          this.ui.rows.addEventListener("click", (e) => {
            if (e.target.classList.contains("mcp-plugin__channel-name")) {
              this.copyToClipboard(`Connect to Figma, channel ${e.target.textContent}`);
            }
          });

          window.onmessage = (event) => this.handleFigmaMessage(event.data.pluginMessage);
        }

        /* ── Channel-name helpers ──────────────────────────────── */

        suffixName(n) {
          return `${this.baseName}_${n}`;
        }

        // Base of a channel row name = everything before a trailing _<n>; used to tell a saved
        // list's project apart from the open file (a per-plugin-global list may be from another file).
        channelBase(name) {
          const m = /^(.*)_\d+$/.exec((name || "").trim());
          return m ? m[1] : (name || "").trim();
        }

        // Highest numeric suffix currently in use (so "+" never collides).
        maxSuffix() {
          let max = 0;
          for (const c of this.connections) {
            const m = /_(\d+)$/.exec(c.channel || "");
            if (m) max = Math.max(max, parseInt(m[1], 10));
          }
          return max;
        }

        /* ── Row lifecycle ─────────────────────────────────────── */

        // Build the initial rows: restore the persisted list, else 5 defaults (_1.._5).
        bootRows(savedChannels) {
          if (this.booted) return;
          const hasSaved = Array.isArray(savedChannels) && savedChannels.length;
          // Don't clobber a saved list that just hasn't loaded yet: committing default rows (and
          // persist()-ing them) before init-settings arrives would overwrite the user's real list
          // in clientStorage. Only default-boot once init-settings has been observed (so we KNOW
          // there is no saved list) — init-settings itself, or its 300ms timer, drives that path.
          if (!hasSaved && !this.sawInitSettings) return;
          this.booted = true;
          const fc = this.fileChannel;
          let names;
          if (hasSaved && (!fc || this.channelBase(savedChannels[0]) === fc)) {
            names = savedChannels;                                   // match, or no file name → restore verbatim
          } else if (fc) {
            names = [1, 2, 3, 4, 5].map((n) => `${fc}_${n}`);        // stale list vs open file → rebase, discard saved
          } else {
            names = [1, 2, 3, 4, 5].map((n) => this.suffixName(n));  // no saved, no file name → baseName default (unchanged)
          }
          for (const name of names) this.addChannelRow(name, { silent: true });
          this.persist();
          this.requestResize();
          this.maybeAutoConnectAll();
        }

        // Auto-connect ALL rows (the 5 defaults <file>_1.._5, or the restored saved list), once,
        // after rows exist — regardless of whether init-settings or auto-connect won the boot race.
        // Parallel agents on one file each get a live channel without manual clicking; the single
        // serialization queue still feeds the sandbox one command at a time, so 5 live sockets never
        // cause concurrent document mutation.
        maybeAutoConnectAll() {
          if (this.wantAutoConnect && !this.autoConnectedOnce && this.booted && this.connections.length) {
            this.autoConnectedOnce = true;
            for (const conn of this.connections) this.connect(conn);
          }
        }

        addChannelRow(channel, opts = {}) {
          const name = (channel || this.suffixName(this.maxSuffix() + 1)).trim();
          const rowId = `row-${this.rowSeq++}`;

          const row = document.createElement("div");
          row.className = "mcp-plugin__row";
          row.dataset.rowid = rowId;

          const top = document.createElement("div");
          top.className = "mcp-plugin__row-top";

          const input = document.createElement("input");
          input.type = "text";
          input.className = "mcp-plugin__channel-input";
          input.autocomplete = "off";
          input.spellcheck = false;
          input.placeholder = "channel";
          input.value = name;

          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "mcp-plugin__row-toggle";
          toggle.textContent = "Connect";

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "mcp-plugin__row-remove";
          remove.title = "Remove channel";
          remove.textContent = "×";

          top.appendChild(input);
          top.appendChild(toggle);
          top.appendChild(remove);

          const status = document.createElement("div");
          status.className = "mcp-plugin__connection-status idle";
          status.textContent = "Not connected";

          row.appendChild(top);
          row.appendChild(status);
          this.ui.rows.appendChild(row);

          const conn = {
            rowId,
            channel: name,
            socket: null,
            connected: false,
            userClosed: false, // true once the user clicked Disconnect/Remove — suppresses auto-reconnect
            reconnectTimer: null, // pending backoff timer id
            retryStep: 0, // backoff step: delay = min(2^(step+1)*1000, 30000)
            els: { row, input, toggle, remove, status },
          };
          this.connections.push(conn);

          toggle.addEventListener("click", () => {
            if (conn.connected) this.disconnect(conn);
            else this.connect(conn);
          });
          remove.addEventListener("click", () => this.removeRow(conn));
          input.addEventListener("change", () => {
            conn.channel = (input.value || "").trim();
            this.persist();
          });

          if (!opts.silent) {
            this.persist();
            this.requestResize();
          }
          return conn;
        }

        removeRow(conn) {
          this.disconnect(conn);
          conn.els.row.remove();
          this.connections = this.connections.filter((c) => c !== conn);
          this.persist();
          this.requestResize();
        }

        /* ── Per-row status UI ─────────────────────────────────── */

        setStatus(conn, cls, html) {
          conn.els.status.className = `mcp-plugin__connection-status ${cls}`;
          conn.els.status.innerHTML = html;
          conn.els.row.classList.toggle("is-connected", conn.connected);
          conn.els.toggle.textContent = conn.connected ? "Disconnect" : "Connect";
          conn.els.input.disabled = conn.connected;
        }

        // Escape relay/user-supplied strings before they go into setStatus's innerHTML (the channel
        // name and relay error message are external data — raw interpolation is a DOM-XSS vector).
        escapeHtml(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
          );
        }

        /* ── Connect / disconnect (per row) ────────────────────── */

        connect(conn) {
          try {
            if (conn.connected && conn.socket) {
              this.setStatus(conn, "connected", "Already connected");
              return;
            }
            const channel = (conn.els.input.value || "").trim();
            if (!channel) {
              this.setStatus(conn, "idle", "Type a channel name first.");
              return;
            }
            conn.channel = channel;
            // A (re)connect attempt is under way: this row is MEANT to be up, so clear any
            // intentional-close flag and cancel a pending backoff timer (this call may itself be that
            // timer firing).
            conn.userClosed = false;
            this.clearReconnect(conn);
            this.setStatus(conn, "info", `Connecting on port ${Number(this.serverPort)}…`); // #1103 port-coerce — serverPort goes into innerHTML; Number() it (defense in depth)

            const socket = new WebSocket(`ws://localhost:${this.serverPort}`);
            conn.socket = socket;

            socket.onopen = () => {
              socket.send(JSON.stringify({ type: "join", channel }));
              // #873 join-timeout — a silent relay never replies with type:system, so without a
              // deadline the row sticks on "Connecting…" forever. On expiry: surface an error, drop
              // the stuck socket, and reconnect with the normal backoff.
              conn.joinTimer = setTimeout(() => {
                conn.joinTimer = null;
                this.setStatus(conn, "disconnected", "Join timed out — no relay confirmation.");
                this.scheduleReconnect(conn);
                try { socket.close(); } catch (e) { /* closing */ }
              }, 10000);
            };

            socket.onmessage = (event) => {
              let data;
              try {
                data = JSON.parse(event.data);
              } catch (err) {
                console.error("Error parsing message:", err);
                return;
              }

              if (data.type === "system") {
                if (data.message && data.message.result) {
                  conn.connected = true;
                  this.clearJoinTimer(conn); // #873 — join confirmed; cancel the timeout
                  conn.retryStep = 0; // successful (re)connect → reset the backoff ladder
                  const ch = data.channel || channel;
                  conn.channel = ch;
                  this.setStatus(
                    conn,
                    "connected",
                    `Connected on port ${this.serverPort} — ` +
                      `<span class="mcp-plugin__channel-name" title="Click to copy">${this.escapeHtml(ch)}</span>`
                  );
                  this.persist();
                  this.notify(`Connected on port ${this.serverPort}. Channel: ${ch}`);
                }
              } else if (data.type === "error") {
                console.error("Relay error:", data.message);
                this.setStatus(conn, "disconnected", `Error: ${this.escapeHtml(data.message)}`);
                try { socket.close(); } catch (e) { /* closing */ }
              }

              this.handleSocketMessage(conn, data);
            };

            socket.onclose = () => {
              conn.connected = false;
              conn.socket = null;
              this.clearJoinTimer(conn); // #873 — socket gone; a pending join timeout is moot
              this.dropPendingFor(conn);
              // An UNEXPECTED drop (relay restart, network blip) auto-reconnects with backoff; an
              // intentional user Disconnect/Remove set userClosed first and stays down.
              if (conn.userClosed) this.setStatus(conn, "idle", "Not connected");
              else this.scheduleReconnect(conn);
            };

            socket.onerror = (err) => {
              console.error("WebSocket error:", err);
              conn.connected = false;
              conn.socket = null;
              this.clearJoinTimer(conn); // #873 — socket errored; a pending join timeout is moot
              this.dropPendingFor(conn);
              if (conn.userClosed) this.setStatus(conn, "disconnected", "Connection error");
              else this.scheduleReconnect(conn);
            };
          } catch (error) {
            console.error("Connection error:", error);
            this.setStatus(conn, "disconnected", `Connection error: ${this.escapeHtml(error.message || "Unknown")}`);
            this.scheduleReconnect(conn); // #1114 reconnect — a synchronous new WebSocket() throw otherwise stays down forever (onerror/onclose never fire)
          }
        }

        disconnect(conn) {
          // Mark intentional BEFORE close() so the socket's onclose handler suppresses auto-reconnect.
          conn.userClosed = true;
          this.clearReconnect(conn);
          this.clearJoinTimer(conn);
          if (conn.socket) {
            try { conn.socket.close(); } catch (e) { /* already closing */ }
          }
          conn.socket = null;
          conn.connected = false;
          conn.retryStep = 0;
          this.dropPendingFor(conn);
          this.setStatus(conn, "idle", "Not connected");
        }

        /* ── Auto-reconnect (capped backoff, indefinite) ───────────── */

        // Arm a backoff retry for a row that dropped unexpectedly. Delay climbs 2s→4s→8s→16s→30s and
        // caps at 30s, retrying forever until it reconnects or the user Disconnects/Removes. onerror
        // and onclose can both fire for one drop, so a pending timer is never re-armed (that would
        // double the backoff step); connect() resets the step on success and clears the timer.
        scheduleReconnect(conn) {
          if (conn.userClosed || conn.reconnectTimer) return;
          const delay = Math.min(Math.pow(2, conn.retryStep + 1) * 1000, 30000);
          conn.retryStep += 1;
          this.setStatus(conn, "info", `Reconnecting in ${Math.round(delay / 1000)}s…`);
          conn.reconnectTimer = setTimeout(() => {
            conn.reconnectTimer = null;
            if (!conn.userClosed) this.connect(conn);
          }, delay);
        }

        clearReconnect(conn) {
          if (conn.reconnectTimer) {
            clearTimeout(conn.reconnectTimer);
            conn.reconnectTimer = null;
          }
        }

        clearJoinTimer(conn) {
          if (conn.joinTimer) {
            clearTimeout(conn.joinTimer);
            conn.joinTimer = null;
          }
        }

        // A socket died with commands in flight → clear its routing entries so the queue never
        // stalls waiting on a reply that can never arrive.
        dropPendingFor(conn) {
          for (const [id, c] of this.pending) {
            if (c === conn) this.pending.delete(id);
          }
          this.queue = this.queue.filter((q) => q.connection !== conn);
          // Deliberately do NOT free `inFlight` here. The sandbox command is already running and
          // uncancellable; freeing the lock now would dispatch a SECOND command concurrently against
          // the one shared Figma document. The orphaned command's reply (or the watchdog) will fire
          // finishCommand, which advances the queue safely. We only drop its ROUTING entry so the
          // reply is silently discarded instead of sent out a dead socket.
        }

        /* ── Relay → sandbox (serialized) ──────────────────────── */

        handleSocketMessage(conn, payload) {
          const data = payload.message;
          if (!data) return;

          // Commands flow relay → sandbox only; the plugin never initiates its own requests, so
          // there is nothing to route the other way here.

          // A command from an agent → enqueue for the sandbox, tagged with its origin connection.
          if (data.command) {
            this.queue.push({ connection: conn, msg: data });
            this.pump();
          }
        }

        // Feed the sandbox ONE command at a time. The sandbox mutates a single shared Figma
        // document, so overlapping commands from different channels must not interleave.
        pump() {
          if (this.inFlight || !this.queue.length) return;
          const { connection, msg } = this.queue.shift();
          if (!connection.connected || !connection.socket) {
            // origin died while queued — skip and continue.
            this.pump();
            return;
          }
          this.inFlight = true;
          this.inFlightId = msg.id;
          this.pending.set(msg.id, connection);
          this.startWatchdog(msg.id);
          try {
            parent.postMessage(
              {
                pluginMessage: {
                  type: "execute-command",
                  id: msg.id,
                  command: msg.command,
                  params: msg.params,
                },
              },
              "*"
            );
          } catch (error) {
            this.finishCommand(msg.id);
            this.sendErrorResponse(connection, msg.id, error.message || "Error executing command");
          }
        }

        finishCommand(id) {
          this.pending.delete(id);
          // Guard the serialization lock: only the CURRENTLY in-flight command may release it and
          // advance the queue. A late/orphaned reply for an already-superseded command (e.g. a dead
          // socket's command that finished after the queue moved on) must not reset inFlight for the
          // command now running — that would run two commands against the shared doc at once.
          if (id !== this.inFlightId) return;
          this.clearWatchdog();
          this.inFlightId = null;
          this.inFlight = false;
          this.pump();
        }

        // Recover the queue only when a command's ORIGIN SOCKET has died and its sandbox command
        // hung (dropPendingFor cleared the routing entry but can't free the uncancellable lock).
        // Crucially we do NOT force-advance while the origin is still alive: a slow op that merely
        // hasn't emitted progress is probably still running in the sandbox, and pumping the next
        // command now would run two mutations against the one shared Figma doc — the exact hazard
        // the inFlightId guard exists to prevent. For a live-but-slow op we just re-arm and log.
        // (command_progress re-arms this too, so any progressing op never trips it.)
        startWatchdog(id) {
          this.clearWatchdog();
          this.inFlightTimer = setTimeout(() => {
            if (!this.inFlight || this.inFlightId !== id) return;
            const conn = this.pending.get(id);
            if (conn && conn.connected && conn.socket) {
              // Origin alive → command likely still running. Keep the lock; wait another interval.
              console.warn(`ctf: command ${id} still running after 60s with no progress — holding serialization lock (origin alive).`);
              this.startWatchdog(id);
              return;
            }
            // Origin is gone and the command hung → safe to release the lock and advance.
            console.warn(`ctf: command ${id} timed out with a dead origin — releasing serialization lock.`);
            if (conn) this.sendErrorResponse(conn, id, "Command timed out (no response from Figma).");
            this.finishCommand(id);
          }, 60000);
        }

        clearWatchdog() {
          if (this.inFlightTimer) {
            clearTimeout(this.inFlightTimer);
            this.inFlightTimer = null;
          }
        }

        /* ── Sandbox → relay (routed by command id) ────────────── */

        handleFigmaMessage(message) {
          if (!message) return;
          switch (message.type) {
            case "init-settings":
              this.sawInitSettings = true;
              if (message.settings) {
                if (message.settings.serverPort) this.serverPort = message.settings.serverPort;
                this.pendingSavedChannels = Array.isArray(message.settings.channels)
                  ? message.settings.channels
                  : null;
              }
              // Always defer the boot to the 300ms fallback: auto-connect (which carries the open
              // file's name) can then arrive first, so bootRows compares the saved list's base to the
              // open file instead of restoring a stale per-plugin-global list (the rebase bug). If
              // auto-connect never fires, the timer boots with no file name and restores the saved list.
              setTimeout(() => this.bootRows(this.pendingSavedChannels), 300);
              break;
            case "auto-connect": {
              const fileName = (message.fileChannel || "").trim();
              const fileKey = (message.fileKey || "").trim();
              // Channel base = "<fileKey>_<fileName>": the fileKey is the immutable file identity (so
              // two files never collide and a rename never shifts the base), the name is a readable
              // suffix. No fileKey (unsaved file) → fall back to the name alone (#1178 behavior).
              const fileChannel = fileKey && fileName ? `${fileKey}_${fileName}` : (fileKey || fileName);
              if (fileChannel) { this.baseName = fileChannel; this.fileChannel = fileChannel; }
              // Convenience: auto-connect all rows (the 5 defaults), once. Deferred to
              // maybeAutoConnectAll so it fires whether auto-connect or init-settings boots the rows
              // (bootRows may no-op here if init-settings hasn't delivered the saved list yet).
              this.wantAutoConnect = true;
              this.bootRows(this.pendingSavedChannels);
              this.maybeAutoConnectAll();
              break;
            }
            case "auto-disconnect":
              for (const conn of this.connections) this.disconnect(conn);
              break;
            case "command-result":
              this.routeResult(message.id, (conn) =>
                this.sendSuccessResponse(conn, message.id, message.result)
              );
              break;
            case "command-error":
              this.routeResult(message.id, (conn) =>
                this.sendErrorResponse(conn, message.id, message.error)
              );
              break;
            case "command_progress":
              // Progress = the command is alive; push the watchdog out so a long op isn't timed out.
              if (this.inFlight && this.inFlightId === message.commandId) this.startWatchdog(message.commandId);
              this.updateProgress(message);
              this.routeProgress(message);
              break;
          }
        }

        // Look up which connection a command belongs to, hand it to `send`, then advance the queue.
        routeResult(id, send) {
          const conn = this.pending.get(id);
          if (conn) send(conn);
          this.finishCommand(id);
        }

        routeProgress(message) {
          const conn = this.pending.get(message.commandId);
          if (conn) this.sendProgressUpdate(conn, message);
        }

        sendSuccessResponse(conn, id, result) {
          if (!conn.connected || !conn.socket) return;
          conn.socket.send(
            JSON.stringify({ id, type: "message", channel: conn.channel, message: { id, result } })
          );
        }

        sendErrorResponse(conn, id, errorMessage) {
          if (!conn || !conn.connected || !conn.socket) return;
          conn.socket.send(
            JSON.stringify({
              id,
              type: "message",
              channel: conn.channel,
              message: { id, error: errorMessage },
            })
          );
        }

        sendProgressUpdate(conn, data) {
          if (!conn.connected || !conn.socket) return;
          conn.socket.send(
            JSON.stringify({
              id: data.commandId,
              type: "progress_update",
              channel: conn.channel,
              message: { id: data.commandId, type: "progress_update", data: data },
            })
          );
        }

        /* ── Shared progress bar (whichever command is active) ──── */

        updateProgress(data) {
          this.ui.progressContainer.classList.remove("hidden");
          const progress = data.progress || 0;
          this.ui.progressBar.style.width = `${progress}%`;
          this.ui.progressPercentage.textContent = `${progress}%`;
          this.ui.progressMessage.textContent = data.message || "Operation in progress";

          if (data.status === "started" || data.status === "in_progress") {
            this.ui.progressStatus.textContent = data.status === "started" ? "Started" : "In Progress";
            this.ui.progressStatus.className = "";
          } else if (data.status === "completed") {
            this.ui.progressStatus.textContent = "Completed";
            this.ui.progressStatus.className = "operation-complete";
            setTimeout(() => this.ui.progressContainer.classList.add("hidden"), 5000);
          } else if (data.status === "error") {
            this.ui.progressStatus.textContent = "Error";
            this.ui.progressStatus.className = "operation-error";
          }
        }

        /* ── Persistence + resize (via the sandbox) ────────────── */

        persist() {
          const channels = this.connections.map((c) => (c.els.input.value || "").trim()).filter(Boolean);
          parent.postMessage(
            { pluginMessage: { type: "update-settings", channel: channels[0] || null, channels } },
            "*"
          );
        }

        requestResize() {
          // Let layout settle, then ask the sandbox to size the window to the content.
          requestAnimationFrame(() => {
            const height = Math.ceil(document.body.scrollHeight) + 8;
            parent.postMessage({ pluginMessage: { type: "resize", width: 320, height } }, "*");
          });
        }

        /* ── Misc ──────────────────────────────────────────────── */

        notify(message) {
          parent.postMessage({ pluginMessage: { type: "notify", message } }, "*");
        }

        async copyToClipboard(text) {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(text);
              this.notify(`Channel ID copied: ${text}`);
              return;
            }
            throw new Error("Clipboard API not available");
          } catch (err) {
            try {
              const ta = document.createElement("textarea");
              ta.value = text;
              ta.style.position = "fixed";
              ta.style.left = "-9999px";
              document.body.appendChild(ta);
              ta.focus();
              ta.select();
              const ok = document.execCommand("copy");
              document.body.removeChild(ta);
              if (ok) this.notify(`Channel ID copied: ${text}`);
              else throw new Error("execCommand copy failed");
            } catch (fallbackErr) {
              console.error("All copy methods failed:", fallbackErr);
            }
          }
        }

        toggleMode() {
          const isDark = document.body.classList.toggle("dark");
          if (isDark) {
            this.ui.modeSun.classList.remove("hidden");
            this.ui.modeMoon.classList.add("hidden");
          } else {
            this.ui.modeSun.classList.add("hidden");
            this.ui.modeMoon.classList.remove("hidden");
          }
        }
      }

      const plugin = new ClaudeMCPPlugin();
    </script>
  </body>
</html>
